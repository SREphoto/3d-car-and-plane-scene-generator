      { cat: 'Planes', id: 'lockheed-f22-raptor', url: '/3D%20Car%20and%20Plane%20Scene%20Creator/Planes/lockheed-f22-raptor/source/lockheed-f22-raptor.glb' },
      { cat: 'Planes', id: 'boeing-787-dreamliner', url: '/3D%20Car%20and%20Plane%20Scene%20Creator/Planes/boeing-787-dreamliner/source/boeing-787-dreamliner.glb' },
      { cat: 'Planes', id: 'concorde-supersonic', url: '/3D%20Car%20and%20Plane%20Scene%20Creator/Planes/concorde-supersonic/source/concorde-supersonic.glb' },
      { cat: 'Planes', id: 'supermarine-spitfire', url: '/3D%20Car%20and%20Plane%20Scene%20Creator/Planes/supermarine-spitfire/source/supermarine-spitfire.glb' },
      { cat: 'Planes', id: 'lockheed-sr71-blackbird', url: '/3D%20Car%20and%20Plane%20Scene%20Creator/Planes/lockheed-sr71-blackbird/source/lockheed-sr71-blackbird.glb' },

    ];

    async function run() {
      log('Starting WebGL Stress Test across ' + MODELS.length + ' models...');
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(320, 240);
      } catch (e) {
        log('FATAL: WebGLRenderer init failed: ' + e.message);
        window.__WEBGL_TEST_STATUS__ = { passed: false, error: e.message };
        return;
      }

      const gl = renderer.getContext();
      log('WebGL Context acquired: ' + (gl instanceof WebGLRenderingContext ? 'WebGL1' : 'WebGL2'));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 320 / 240, 0.1, 100);
      camera.position.set(0, 2, 5);
      camera.lookAt(0, 0, 0);

      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(5, 10, 7);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040, 1.5));

      const holder = new THREE.Group();
      scene.add(holder);

      const loader = new GLTFLoader();
      let passCount = 0;
      let failCount = 0;

      for (let i = 0; i < MODELS.length; i++) {
        const m = MODELS[i];
        while (holder.children.length > 0) {
          holder.remove(holder.children[0]);
        }

        try {
          const gltf = await new Promise((resolve, reject) => {
            loader.load(m.url, resolve, undefined, reject);
          });

          holder.add(gltf.scene);
          renderer.render(scene, camera);

          const errCode = gl.getError();
          if (errCode !== gl.NO_ERROR) {
            throw new Error('gl.getError() returned code ' + errCode);
          }

          passCount++;
          log(`[${i+1}/${MODELS.length}] PASS: ${m.id}`);
        } catch (err) {
          failCount++;
          log(`[${i+1}/${MODELS.length}] FAIL: ${m.id} - ${err.message}`);
        }
      }

      log(`\nCOMPLETED: ${passCount} passed, ${failCount} failed.`);
      window.__WEBGL_TEST_STATUS__ = {
        passed: failCount === 0 && passCount === MODELS.length,
        passCount,
        failCount
      };

      try {
        await fetch('/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(window.__WEBGL_TEST_STATUS__)
        });
      } catch (err) {
        console.error('Failed to post report:', err);
      }

      const doneIndicator = document.createElement('div');
      doneIndicator.id = 'done-indicator';
      doneIndicator.textContent = window.__WEBGL_TEST_STATUS__.passed ? 'ALL_PASSED' : 'TESTS_FAILED';
      document.body.appendChild(doneIndicator);
    }

    run().catch((e) => {
      log('FATAL ERROR: ' + e.message);
      window.__WEBGL_TEST_STATUS__ = { passed: false, error: e.message };
    });
  </script>
